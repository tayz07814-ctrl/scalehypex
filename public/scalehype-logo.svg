<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 128" width="100%" height="100%">
  <defs>
    <!-- Scale Arc Gradient -->
    <linearGradient id="sh-l-scale" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#25F4EE" />
      <stop offset="85%" stop-color="#1877F2" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Hype Arc Gradient -->
    <linearGradient id="sh-l-hype" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="35%" stop-color="#D946EF" />
      <stop offset="80%" stop-color="#FE2C55" />
      <stop offset="100%" stop-color="#FF5757" />
    </linearGradient>

    <!-- Wordmark Gradient for "Hypex" -->
    <linearGradient id="sh-l-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25F4EE" />
      <stop offset="40%" stop-color="#60A5FA" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FE2C55" />
    </linearGradient>

    <!-- Icon Squircle Background -->
    <linearGradient id="sh-l-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#04060B" />
    </linearGradient>

    <linearGradient id="sh-l-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FE2C55" stop-opacity="0.8" />
    </linearGradient>

    <filter id="sh-l-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Icon Section (112x112 at x: 8, y: 8) -->
  <g transform="translate(8, 8)">
    <rect width="112" height="112" rx="28" fill="url(#sh-l-bg)" />
    <rect width="110" height="110" x="1" y="1" rx="27" fill="none" stroke="url(#sh-l-border)" stroke-width="1.5" opacity="0.85" />
    
    <!-- ScaleHype Mark scaled to 112px -->
    <g transform="translate(0, 0) scale(0.21875)" filter="url(#sh-l-shadow)">
      <!-- Lower Arc -->
      <path
        d="M 336 348 C 336 398, 296 434, 236 434 C 168 434, 118 398, 108 344 L 182 322 C 188 350, 210 368, 238 368 C 268 368, 282 354, 282 336 C 282 318, 268 306, 234 294 L 194 280 C 126 256, 92 218, 92 158 C 92 134, 104 112, 122 96 L 174 150 C 164 162, 158 174, 158 186 C 158 210, 176 226, 212 240 L 252 254 C 318 278, 350 310, 350 350 Z"
        fill="url(#sh-l-scale)"
      />
      <!-- Upper Arc -->
      <path
        d="M 176 164 C 176 114, 216 78, 276 78 C 344 78, 394 114, 404 168 L 330 190 C 324 162, 302 144, 274 144 C 244 144, 230 158, 230 176 C 230 194, 244 206, 278 218 L 318 232 C 386 256, 420 294, 420 354 C 420 378, 408 400, 390 416 L 338 362 C 348 350, 354 338, 354 326 C 354 302, 336 286, 300 272 L 260 258 C 194 234, 162 202, 162 162 Z"
        fill="url(#sh-l-hype)"
      />
      <!-- Lightning Bolt -->
      <polygon points="268,198 292,246 258,248 278,314 226,254 262,252" fill="#FFFFFF" opacity="0.98" />
    </g>
  </g>

  <!-- Typography: ScaleHypex -->
  <g transform="translate(138, 82)">
    <text
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Nunito', sans-serif"
      font-weight="900"
      font-size="62"
      letter-spacing="-0.035em"
    >
      <tspan fill="#0F172A" class="dark-fill-white">Scale</tspan><tspan fill="url(#sh-l-text-grad)">Hypex</tspan>
    </text>
  </g>

  <style>
    @media (prefers-color-scheme: dark) {
      .dark-fill-white { fill: #FFFFFF !important; }
    }
  </style>
</svg>
