name: Build & Push yt-dlp Container

on:
  push:
    paths:
      - "docker/yt-dlp/Dockerfile"
      - ".github/workflows/build-ytdlp.yml"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker/yt-dlp
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/scalehypex-ytdlp:latest
